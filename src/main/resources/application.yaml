spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:lb://auth-service}
          predicates:
            - Path=/api/v1/auth/**

        - id: rfq-service
          uri: ${RFQ_SERVICE_URL:lb://rfq-service}
          predicates:
            - Path=/api/v1/rfqs/**

        - id: material-service
          uri: ${MATERIAL_SERVICE_URL:lb://material-service}
          predicates:
            - Path=/api/v1/materials/**

        - id: proposal-service
          uri: ${PROPOSAL_SERVICE_URL:lb://proposal-service}
          predicates:
            - Path=/api/v1/proposals/**

        - id: document-service
          uri: ${DOCUMENT_SERVICE_URL:lb://document-service}
          predicates:
            - Path=/api/v1/documents/**

        - id: file-service
          uri: ${FILE_SERVICE_URL:lb://file-service}
          predicates:
            - Path=/api/v1/files/**

        - id: translation-service
          uri: ${TRANSLATION_SERVICE_URL:lb://translation-service}
          predicates:
            - Path=/api/v1/translations/**

        - id: search-service
          uri: ${SEARCH_SERVICE_URL:lb://search-service}
          predicates:
            - Path=/api/v1/search/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:lb://notification-service}
          predicates:
            - Path=/api/v1/notifications/**

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    offeria.api_gateway: INFO
